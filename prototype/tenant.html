<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Community Hub — テナント管理</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#home" aria-label="Community Hub">
          <span class="brand-mark">C</span>
          <span><strong>Community Hub</strong><small>Tenant workspace</small></span>
        </a>
        <nav id="navigation" class="navigation" aria-label="テナント管理">
          <button class="home-link" data-view="home"><span class="nav-icon">⌂</span>ホーム</button>

          <section class="menu-section menu-section-stay" data-menu-section="stay">
            <header class="menu-section-header"><span>◇</span><div><strong>宿泊</strong><small>施設と予約の管理</small></div></header>
            <div class="menu-section-items">
              <button data-view="listings">宿泊施設</button>
              <div class="navigation-context"><small>対象施設</small><strong id="active-listing-name">施設未選択</strong></div>
              <button data-view="reservation-dashboard">予約業務</button>
              <button data-view="reservations">予約一覧</button>
              <button data-view="sales-calendar">販売管理</button>
              <button data-view="facility">施設設定</button>
            </div>
          </section>

          <section class="menu-section menu-section-jobs" data-menu-section="jobs">
            <header class="menu-section-header"><span>□</span><div><strong>求人</strong><small>募集と応募者の管理</small></div></header>
            <div class="menu-section-items">
              <button data-view="jobs">求人一覧 <em id="job-count"></em></button>
              <button data-view="applications">応募者 <em id="application-count"></em></button>
            </div>
          </section>

          <section class="menu-section menu-section-organization" data-menu-section="organization">
            <header class="menu-section-header"><span>◉</span><div><strong>組織</strong><small>基本情報とメンバー</small></div></header>
            <div class="menu-section-items">
              <button data-view="tenant-settings">テナント情報</button>
              <button data-view="members">メンバー</button>
            </div>
          </section>
        </nav>
        <div class="sidebar-footer">
          <a class="account-card" href="#members" aria-label="ログインユーザーとメンバー管理">
            <span id="current-user-avatar" class="account-avatar">O</span>
            <span class="account-copy"><strong id="current-user-name">オーナーアカウント</strong><small id="current-user-role">オーナー・有効</small><small id="current-user-email" class="account-email">owner@example.com</small></span>
            <span class="account-arrow">›</span>
          </a>
          <div class="prototype-note">
            <span class="pulse"></span>
            <div><strong>Prototype mode</strong><small>DBには保存されません</small></div>
          </div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow"><span id="section-label">TENANT</span> / <span id="listing-id"></span></p>
            <h1 id="page-title">概要</h1>
          </div>
          <div class="top-actions">
            <span id="save-state" class="save-state">保存済み</span>
            <button id="export-button" class="button button-ghost">JSONを書き出す</button>
            <button id="reset-button" class="button button-ghost danger">リセット</button>
            <button id="publish-button" class="button button-primary">公開する</button>
          </div>
        </header>
        <div id="notice" class="notice" role="status" hidden></div>
        <div id="content" class="content"></div>
      </main>
    </div>

    <dialog id="modal" class="modal">
      <form id="modal-form" method="dialog">
        <div class="modal-header"><div><p class="eyebrow">QUICK CREATE</p><h2 id="modal-title"></h2></div><button value="cancel" class="icon-button" aria-label="閉じる">×</button></div>
        <div id="modal-body" class="modal-body"></div>
        <div class="modal-actions"><button value="cancel" class="button button-ghost">キャンセル</button><button id="modal-submit" value="default" class="button button-primary">追加する</button></div>
      </form>
    </dialog>

    <script type="module" src="./app.js"></script>
  </body>
</html>
