<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stay Listing Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#listings" aria-label="Stay Listing Studio">
          <span class="brand-mark">S</span>
          <span><strong>Stay Studio</strong><small>Listing prototype</small></span>
        </a>
        <nav id="navigation" class="navigation" aria-label="施設設定">
          <button data-view="listings"><span>01</span>宿泊施設一覧</button>
          <div class="navigation-context"><small>選択中の施設</small><strong id="active-listing-name">施設未選択</strong></div>
          <button data-view="overview"><span>02</span>概要</button>
          <button data-view="facility"><span>03</span>施設情報</button>
          <button data-view="rooms"><span>04</span>部屋と在庫</button>
          <button data-view="rates"><span>05</span>料金プラン</button>
          <button data-view="calendar"><span>06</span>日別設定</button>
          <button data-view="preview"><span>07</span>宿泊者プレビュー</button>
          <button data-view="publish"><span>08</span>公開確認</button>
        </nav>
        <div class="prototype-note">
          <span class="pulse"></span>
          <div><strong>Prototype mode</strong><small>DBには保存されません</small></div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">STAY LISTING / <span id="listing-id"></span></p>
            <h1 id="page-title">概要</h1>
          </div>
          <div class="top-actions">
            <span id="save-state" class="save-state">保存済み</span>
            <button id="export-button" class="button button-ghost">JSONを書き出す</button>
            <button id="reset-button" class="button button-ghost danger">リセット</button>
            <button id="publish-button" class="button button-primary">公開する</button>
          </div>
        </header>
        <div id="notice" class="notice" role="status" hidden></div>
        <div id="content" class="content"></div>
      </main>
    </div>

    <dialog id="modal" class="modal">
      <form id="modal-form" method="dialog">
        <div class="modal-header"><div><p class="eyebrow">QUICK CREATE</p><h2 id="modal-title"></h2></div><button value="cancel" class="icon-button" aria-label="閉じる">×</button></div>
        <div id="modal-body" class="modal-body"></div>
        <div class="modal-actions"><button value="cancel" class="button button-ghost">キャンセル</button><button id="modal-submit" value="default" class="button button-primary">追加する</button></div>
      </form>
    </dialog>

    <script type="module" src="./app.js"></script>
  </body>
</html>
